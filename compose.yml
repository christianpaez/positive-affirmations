services:
  app:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    image: positive_affirmations:dev
    ports:
      - "6767:3000"
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    environment:
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    command: ./bin/rails server -b 0.0.0.0 -p 3000

volumes:
  bundle_data:
